# The CRM app: a Flask user app reading its state from data/.apps/crm/ (its
# CRM_DATA_DIR default). Built in this workspace. It owns its own browser origin
# and serves at /, which is why the command below sets no ROOT_PATH. It registers
# with an explicit --program so the shell can tie the tab back to this
# supervisord program.
[program:crm]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/crm/app.toml --url http://localhost:8091 && exec crm"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/crm-stdout.log
stderr_logfile=/var/log/supervisor/crm-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
