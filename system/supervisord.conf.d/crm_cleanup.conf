[program:crm_cleanup]
command=/home/user/workspace/system/libs/routines/with_agent_env.sh python3 system/services/oom_priority/bin/oom_tag_service.py user uv run python -m people_archive.cleanup run --archive data/.apps/crm/archive.sqlite --ledger data/.apps/crm/cleanup.sqlite --progress data/.apps/crm/cleanup-progress.json --until-complete --workers 2 --apply
directory=/home/user/workspace
autostart=false
autorestart=unexpected
startsecs=0
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/crm_cleanup-stdout.log
stderr_logfile=/var/log/supervisor/crm_cleanup-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
