<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}CRM{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/crm.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <a class="topbar__brand" href="/">Network</a>
    <nav class="topbar__nav">
      <a href="/" class="{% if nav == 'people' %}active{% endif %}">People</a>
      <a href="/lists/outreach" class="{% if nav == 'lists' %}active{% endif %}">Outreach list</a>
      <a href="/merges" class="{% if nav == 'merges' %}active{% endif %}">Duplicates</a>
      {% if cleanup_enabled %}<a href="/cleanup">Cleanup</a>{% endif %}
    </nav>
    <form class="topbar__search" method="get" action="/search" role="search">
      <input type="search" name="q" value="{{ request.args.get('q', '') if nav == 'search' else '' }}" placeholder="Search emails, texts, meetings, notes…  ( / )" id="global-search" autocomplete="off" />
    </form>
  </div>
</header>
<div class="wrap">
  {% block crumbs %}{% endblock %}
  <header class="masthead">
    <div>
      <p class="eyebrow">{% block eyebrow %}Personal CRM{% endblock %}</p>
      <h1>{% block heading %}<span class="accent">Network</span>{% endblock %}</h1>
      {% block sub %}{% endblock %}
    </div>
  </header>
  {% block content %}{% endblock %}
</div>
<script>
  // "/" focuses search from anywhere; Escape leaves it. Back links use history when it is ours.
  document.addEventListener('keydown', function (e) {
    var box = document.getElementById('global-search');
    if (e.key === '/' && document.activeElement !== box && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); box.focus(); }
    if (e.key === 'Escape' && document.activeElement === box) { box.blur(); }
  });
  document.querySelectorAll('a[data-back]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (document.referrer && document.referrer.indexOf(location.origin) === 0 && history.length > 1) { e.preventDefault(); history.back(); }
    });
  });
</script>
</body>
</html>
